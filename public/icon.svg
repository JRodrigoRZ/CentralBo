<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Main Central Emblem Shield -->
  <circle cx="256" cy="256" r="148" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Spokes to Verticals -->
  <line x1="256" y1="150" x2="256" y2="362" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <line x1="150" y1="256" x2="362" y2="256" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

  <!-- Central Hub Core -->
  <circle cx="256" cy="256" r="44" fill="#ffffff" />
  <circle cx="256" cy="256" r="24" fill="#4f46e5" />

  <!-- Satellite Vertical Nodes (Marketplace Verticals: General, Restaurant, Fashion, Services) -->
  <!-- Top: Restaurante -->
  <circle cx="256" cy="150" r="28" fill="#ffffff" />
  <circle cx="256" cy="150" r="16" fill="#f59e0b" />

  <!-- Right: Moda -->
  <circle cx="362" cy="256" r="28" fill="#ffffff" />
  <circle cx="362" cy="256" r="16" fill="#ec4899" />

  <!-- Bottom: Servicios -->
  <circle cx="256" cy="362" r="28" fill="#ffffff" />
  <circle cx="256" cy="362" r="16" fill="#10b981" />

  <!-- Left: General -->
  <circle cx="150" cy="256" r="28" fill="#ffffff" />
  <circle cx="150" cy="256" r="16" fill="#06b6d4" />
</svg>
